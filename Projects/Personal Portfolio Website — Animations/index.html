<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Outline&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .home-page {
            display: flex;
            flex-direction: column;
            background-color: #ffff;
            width: min(1400px, calc(100% - 40px));
            height: 100vh;
            margin: 0 auto;
        }

        .home-page .header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0px 50px;
            margin-top: 20px;
        }

        .home-page .header .header-c1 {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            border: 1px solid #f1eded;
            padding: 5px 10px;
            border-radius: 50px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .home-page .header .header-c1 i {
            color: #6bb111;
        }

        .home-page .header .header-menu {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .home-page .header .header-menu h1 {
            font-size: 16px;
            font-weight: 800;
            color: #000;
            font-family: 'Nunito', sans-serif;
        }

        .home-page .header .header-menu p {
            font-size: 14px;
            font-weight: 400;
            color: #5c5a5a;
            font-family: 'Nunito', sans-serif;
            margin-right: 30px;
        }

        .home-page .header .lets-talk {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            background-color: #000;
            font-size: 14px;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            line-height: 1;
        }

        .home-page .header .lets-talk i {
            font-size: 20px;
            line-height: 1;
        }

        .home-page .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 0px 50px;
            margin-top: 20px;
            height: 100%;
        }

        .home-page .hero .bottom-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .home-page .hero .bottom-layer .text {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .home-page .hero .bottom-layer .text .text1 {
            font-size: 155px;
            font-weight: 800;
            font-family: "Londrina Outline", cursive;
            letter-spacing: 15%;
        }

        .home-page .hero .bottom-layer .text .text2 {
            font-size: 155px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            letter-spacing: -10px;
        }

        .home-page .hero .bottom-layer .menu {
            display: flex;
            flex-direction: row;
            width: 100%;
            justify-content: space-between;
            margin-top: 20px;
        }

        .home-page .hero .bottom-layer .menu .menu1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 50px;
        }

        .home-page .hero .bottom-layer .menu .menu1 h1 {
            font-size: 40px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
        }

        .home-page .hero .bottom-layer .menu .menu1 p {
            font-size: 22px;
            font-weight: 500;
            font-family: 'Nunito', sans-serif;
            color: #5c5a5a;
        }

        .home-page .hero .bottom-layer .menu .menu1 .collaborate {
            display: flex;
            flex-direction: row;
            align-items: center;
            width: fit-content;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            background-color: #000;
            font-size: 14px;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }

        .home-page .hero .bottom-layer .menu .menu1 .collaborate i {
            font-size: 20px;
        }

        .home-page .hero .bottom-layer .menu .menu2 {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-right: 50px;
        }

        .home-page .hero .bottom-layer .menu .menu2 .m1 {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            font-family: 'Nunito', sans-serif;
            border: 1px solid #0a0a0a;
            padding: 5px 10px;
            line-height: 1;
            box-shadow: inset 0 20px 30px rgba(105, 104, 104, 0.1);
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .home-page .hero .bottom-layer .menu .menu2 .m2 {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            font-family: 'Nunito', sans-serif;
            border: 1px solid #0a0a0a;
            padding: 5px 10px;
            line-height: 1;
            box-shadow: inset 0 20px 30px rgba(105, 104, 104, 0.1);
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .home-page .hero .bottom-layer .menu .menu2 .m3 {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            font-family: 'Nunito', sans-serif;
            border: 1px solid #0a0a0a;
            padding: 5px 10px;
            line-height: 1;
            box-shadow: inset 0 20px 30px rgba(105, 104, 104, 0.1);
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .home-page .hero .bottom-layer .menu .menu2 .m4 {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            font-family: 'Nunito', sans-serif;
            border: 1px solid #0a0a0a;
            padding: 5px 10px;
            line-height: 1;
            box-shadow: inset 0 20px 30px rgba(105, 104, 104, 0.1);
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .home-page .hero .upper-layer {
            position: absolute;
            z-index: 1;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            max-width: 45vw;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-page .hero .upper-layer .img-wrapper {
            width: 400px;
            height: 400px;
        }

        .home-page .hero .upper-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <section class="home-page">
        <section class="header">
            <div class="header-c1">
                <i class="fa-solid fa-circle"></i>
                <span>Availiable for new projects</span>
            </div>
            <div class="header-menu">
                <h1>Work</h1>
                <p>[40]</p>
                <h1>Service</h1>
                <p>[4]</p>
                <h1>Experience</h1>
                <p>[9y+]</p>
                <h1>Contact</h1>
            </div>
            <div class="lets-talk">
                <span>Let's Talk</span>
                <i class="fa-solid fa-square-up-right"></i>
            </div>
        </section>
        <section class="hero">
            <div class="bottom-layer">
                <div class="text">
                    <h1 class="text1">MEHAR</h1>
                    <h1 class="text2">HANNAN</h1>
                </div>
                <div class="menu">
                    <div class="menu1">
                        <h1>Ui/Ux Designer</h1>
                        <p>Design digital products that are clear. <br>usable and conversion focused</p>
                        <div class="collaborate">
                            Let's Collaborate
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                    <div class="menu2">
                        <div class="m1">
                            <i class="fa-solid fa-circle"></i>
                            Dribble
                        </div>
                        <div class="m2">
                            <i class="fa-solid fa-circle"></i>
                            Behance
                        </div>
                        <div class="m3">
                            <i class="fa-solid fa-circle"></i>
                            Linkedin
                        </div>
                        <div class="m4">
                            <i class="fa-brands fa-instagram"></i>
                            Instagram
                        </div>
                    </div>
                </div>
            </div>
            <div class="upper-layer">
                <div class="img-wrapper">
                    <img src="assets\img.png" alt="hannan">
                </div>
            </div>
        </section>
    </section>
</body>

</html>
