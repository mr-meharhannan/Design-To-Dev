<main class="screen" id="schedule">
    <c-nav screen="schedule"></c-nav>
    <header class="screen-header">
        <button id="back" type="button" aria-label="Back to dashboard" title="Back to dashboard">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button id="today-btn" type="button">Today</button>
    </header>
    <h1 id="screen-title">Schedule</h1>
    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prev-btn">&lt;</button>
            <h2 id="month-year-display"></h2>
            <button id="next-btn">&gt;</button>
        </div>

        <div class="weeks-grid">
            <div>Su</div>
            <div>Mo</div>
            <div>Tu</div>
            <div>We</div>
            <div>Th</div>
            <div>Fr</div>
            <div>Sa</div>   
        </div>

        <div id="days-grid" class="days-grid" aria-label="Calendar days"></div>
    </div>
    <div class="today-heading"><span id="today">Selected day</span><span id="selected-date"></span></div>
    <div id="today-tasks" class="today-tasks" aria-live="polite"></div>
</main>
